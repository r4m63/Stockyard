ktor {
  deployment {
    port = 8080
    port = ${?CORE_PORT}
    host = "0.0.0.0"
  }
  application {
    modules = [ com.stockyard.core.ApplicationKt.module ]
  }
}

stockyard {
  postgres {
    host     = "postgres"
    host     = ${?PG_HOST}
    port     = 5432
    port     = ${?PG_PORT}
    db       = "stockyard"
    db       = ${?PG_DB}
    user     = "stockyard"
    user     = ${?PG_USER}
    password = ""
    password = ${?PG_PASSWORD}
  }
  redis {
    url      = "redis://redis:6379"
    url      = ${?REDIS_URL}
    password = ""
    password = ${?REDIS_PASSWORD}
  }
  clickhouse {
    host     = "clickhouse"
    host     = ${?CH_HOST}
    port     = 8123
    port     = ${?CH_PORT}
    db       = "stockyard"
    db       = ${?CH_DB}
    user     = "stockyard"
    user     = ${?CH_USER}
    password = ""
    password = ${?CH_PASSWORD}
  }
  argon2 {
    pepper = ""
    pepper = ${?ARGON2_PEPPER}
  }
  otel {
    serviceName  = "core-service"
    serviceName  = ${?OTEL_SERVICE_NAME}
    otlpEndpoint = "http://otel-collector:4317"
    otlpEndpoint = ${?OTEL_EXPORTER_OTLP_ENDPOINT}
  }
}

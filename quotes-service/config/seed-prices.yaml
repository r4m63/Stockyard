# Стартовые котировки для 50 инструментов.
# Quotes Service на старте делает HSET quotes:<ticker> last/bid/ask/volume,
# далее драйвер /dev/stockyard двигает цену random walk-ом.
#
# Цены — копейки (INT64). Для FEES (lot_size=100000), VTBR (10000), HYDR (1000),
# UPRO (1000), NMTP (1000), AFKS/IRAO/SNGS/SNGSP/CBOM (100), SBER/GAZP/MTSS/MOEX/
# NLMK/RTKM/RUAL/AFLT/ALRS/TRMK/SBERP/RASP/MAGN/SGZH/MTLR/MTLRP/BSPB (10) —
# bid/ask строятся вокруг last с шагом 0.5%.
#
# См. docs/architecture/seed/instruments-50.md и docs/architecture/06-data.md §6.3.2.

defaults:
  spread_bps: 50          # 0.5% bid/ask spread
  initial_volume: 0

instruments:

# PostgreSQL config for Stockyard demo (4 GB RAM container).
# См. docs/architecture/12-storage-operations.md §12.1.1.

# --- Memory --------------------------------------------------------------
shared_buffers = 1GB                    # 25% of 4 GB
effective_cache_size = 3GB              # 75%
work_mem = 16MB
maintenance_work_mem = 256MB

# --- Connections ---------------------------------------------------------
max_connections = 200                   # пул 50 × 2 реплики Core Service + запас под exporter
listen_addresses = '*'

# --- WAL / checkpoint ----------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9

# --- pg_stat_statements (нужно для метрик) ------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# --- Logging slow queries / locks ---------------------------------------
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %u@%d trace=%a '

# --- Custom GUC for monitoring role password (read by V7 migration) -----
# Передаётся через POSTGRES_INITDB_ARGS / -c stockyard.monitoring_password=...
# в docker-compose.yml. Если не задан — DO-блок в V7 пропустит CREATE ROLE.

# Redis config for Stockyard demo.
# См. docs/architecture/12-storage-operations.md §12.2.2.

# --- Memory --------------------------------------------------------------
maxmemory 1gb
maxmemory-policy allkeys-lru

# --- Persistence ---------------------------------------------------------
# AOF off (refresh-tokens и кэш восстановимы), RDB hourly если есть данные.
save 3600 1
appendonly no

# --- Network -------------------------------------------------------------
tcp-keepalive 60
timeout 0
bind 0.0.0.0
protected-mode no                  # внутренняя docker-сеть
# requirepass передаётся флагом командной строки из docker-compose,
# чтобы пароль не попал в образ.

# --- Pub/Sub backpressure ------------------------------------------------
# Если subscriber отстаёт > 60 сек с буфером > 32 MB — Redis kick-нёт его.
# GW переподключится, см. docs/architecture/07-consistency.md §7.6.2.
client-output-buffer-limit pubsub 32mb 8mb 60

# --- Streams -------------------------------------------------------------
# MAXLEN для stream:quotes устанавливается в XADD на стороне Quotes Service,
# см. docs/architecture/06-data.md §6.3.2.

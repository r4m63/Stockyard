# Prometheus scrape config for Stockyard storage layer.
# См. docs/architecture/09-observability.md §9.12.6
#     docs/architecture/12-storage-operations.md §12.5.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: stockyard
    environment: ${DEPLOYMENT_ENVIRONMENT:-dev}

scrape_configs:
  # PostgreSQL — exporter sidecar.
  - job_name: postgres_exporter
    static_configs:
      - targets: [postgres-exporter:9187]

  # Redis — exporter sidecar.
  - job_name: redis_exporter
    static_configs:
      - targets: [redis-exporter:9121]

  # ClickHouse — встроенный /metrics endpoint.
  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: [clickhouse:9363]

  # API Gateway (Kotlin/Ktor). /metrics endpoint появится в TASK-005
  # (Micrometer→Prometheus bridge); до тех пор job будет показывать up=0.
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:8080]

  # OpenTelemetry Collector — Prometheus exporter (если настроен).
  - job_name: otel_collector
    static_configs:
      - targets: [otel-collector:8889]

  # Self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
